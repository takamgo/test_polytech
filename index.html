子がいるかを調査したところ、地域 Q のデータの平均値は 6、分散は 6 であり、地域 R のデータの平均値は 8、分散は 2 であった。この2つのデータを合わせた10人のデータについて、平均値を z̄、分散を s²_z とするとき、z̄=[4]，s²_z=[5] である。", "opts": "<div class=\"grp\"><span class=\"no\">4</span><div class=\"row\"><span class=\"op\"><span class=\"k\">ア</span>6</span><span class=\"op\"><span class=\"k\">イ</span>6.5</span><span class=\"op\"><span class=\"k\">ウ</span>7</span><span class=\"op\"><span class=\"k\">エ</span>7.5</span><span class=\"op\"><span class=\"k\">オ</span>8</span></div></div><div class=\"grp\"><span class=\"no\">5</span><div class=\"row\"><span class=\"op\"><span class=\"k\">ア</span>2</span><span class=\"op\"><span class=\"k\">イ</span>3</span><span class=\"op\"><span class=\"k\">ウ</span>4</span><span class=\"op\"><span class=\"k\">エ</span>5</span><span class=\"op\"><span class=\"k\">オ</span>6</span></div></div>", "ans": ["ウ", "エ"], "blank": ["3", "4"], "hint": "合併平均 z̄ = (5·6+5·8)/10 = 7。合併分散は「各群の分散 + 群平均と全体平均の差の2乗」を人数で重み付けして足す。s² = {5(6+1)+5(2+1)}/10 = 5。"}]}, {"n": 68, "cat": "cD", "kind": "pdf", "tag": "R4", "lead": "", "items": [{"i": 1, "tx": "U={n | n は9以下の自然数} を全体集合とするとき、U の部分集合 A={1, 4, 5, 8}、B={2, 4, 7, 8} について、A̅∩B̅=[1] である。", "opts": "<div class=\"grp\"><span class=\"no\">1</span><div class=\"row\"><span class=\"op\"><span class=\"k\">ア</span>{4, 5}</span><span class=\"op\"><span class=\"k\">イ</span>{4, 8}</span><span class=\"op\"><span class=\"k\">ウ</span>{3, 6, 9}</span><span class=\"op\"><span class=\"k\">エ</span>{1, 2, 4, 5, 7, 8}</span><span class=\"op\"><span class=\"k\">オ</span>{1, 2, 3, 5, 6, 7, 9}</span></div></div>", "ans": ["ウ"], "blank": ["1"], "hint": "A̅∩B̅ は「AにもBにも入らない要素」＝ (A∪B) の補集合。U={1,…,9} から {1,2,4,5,7,8} を除く。"}, {"i": 2, "tx": "右の表は、25人の5点満点の小テストの結果である。中央値が2点、最頻値が3点であるとき、x=[2]、y=[3] である。また、このとき、平均値は [4]、分散は [5] である。<div class=\"tw\"><table class=\"tb\"><tr><th>点数（点）</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>合計</th></tr><tr><th>人数（人）</th><td>1</td><td>5</td><td>x</td><td>y</td><td>3</td><td>1</t const app=document.getElementById('app'), toc=document.getElementById('toc');
const byCat={};
DATA.blocks.forEach(b=>{(byCat[b.cat]=byCat[b.cat]||[]).push(b);});
function makeCard(b){
  const card=document.createElement('div'); card.className='card'; card.id='q'+b.n;
  const hd=document.createElement('div'); hd.className='head';
  const isOrig=b.kind==='orig';
  const tag=isOrig?'オリジナル':(b.tag||'過去問');
  hd.innerHTML='<span class="n">'+b.n+'</span><span class="src'+(isOrig?' orig':'')+'">'+tag+'</span>';
  card.appendChild(hd);
  if(b.lead){const ld=document.createElement('div'); ld.className='lead'; ld.innerHTML=b.lead; card.appendChild(ld);}
  b.items.forEach(it=>{
    const d=document.createElement('div'); d.className='it';
    const tx=document.createElement('div'); tx.className='tx';
    tx.innerHTML='<span class="lb">'+b.n+'（'+it.i+'）</span><span class="txx">'+it.tx+'</span>';
    d.appendChild(tx);
    if(it.opts){const od=document.createElement('div'); od.className='opts'; od.innerHTML=it.opts; d.appendChild(od);}
    const ft=document.createElement('div'); ft.className='hr';
    const btn=document.createElement('button'); btn.className='btn'; btn.textContent='こたえ';
    const ans=document.createElement('div'); ans.className='ans';
    ans.innerHTML=it.ans.map((v,j)=>'<span class="a">'+(it.ans.length>1?'('+it.blank[j]+') ':'')+'<b>'+v+'</b></span>').join('');
    if(it.hint){const ex=document.createElement('div');ex.className='exp';ex.innerHTML='<b>解説</b>　'+it.hint;ans.appendChild(ex);}
    btn.addEventListener('click',()=>{const on=ans.classList.toggle('show');btn.classList.toggle('on',on);btn.textContent=on?'とじる':'こたえ';});
    ft.appendChild(btn); ft.appendChild(ans); d.appendChild(ft);
    card.appendChild(d);
  });
  return card;
}
DATA.papers.forEach(p=>{
  const bs=byCat[p.anchor]||[];
  const a=document.createElement('a'); a.href='#'+p.anchor;
  a.textContent=(p.range?p.range+'　':'')+p.name; toc.appendChild(a);
  const sec=document.createElement('section'); sec.className='cat'; sec.id=p.anchor;
  const h=document.createElement('h2'); h.textContent=p.name; sec.appendChild(h);
  const cnt=document.createElement('div'); cnt.className='cnt'; cnt.textContent='全'+bs.length+'問'; sec.appendChild(cnt);
  [['pdf','過去問'],['orig','オリジナル（自動生成）']].forEach(kk=>{
    const list=bs.filter(b=>b.kind===kk[0]);
    if(!list.length) return;
    const sub=document.createElement('div'); sub.className='sub';
    sub.textContent=kk[1]+'（'+list.length+'問）'; sec.appendChild(sub);
    list.forEach(b=>sec.appendChild(makeCard(b)));
  });
  app.appendChild(sec);
});
